name: Publish Plugin

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:

# CI-03: least-privilege default. The publish-npm job re-declares the OIDC
# id-token: write scope it needs for provenance; every other job inherits only
# contents: read.
permissions:
  contents: read

jobs:
  # REL-01: validate FIRST. No publish step runs until this job proves the tag,
  # Cargo, and npm versions agree AND the package builds + tests cleanly.
  validate:
    name: Validate tag, versions, build, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service

      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # (a) Tag == Cargo == npm version. Workflow_dispatch runs (no tag) skip
      # the tag check; the cargo/npm equality check still runs.
      - name: Verify tag / Cargo / npm version agreement
        run: |
          set -euo pipefail
          CARGO_VERSION=$(python3 -c "import re; t=open('tauri-plugin-background-service/Cargo.toml').read(); m=re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.M); print(m.group(1))")
          NPM_VERSION=$(python3 -c "import json; print(json.load(open('tauri-plugin-background-service/guest-js/package.json'))['version'])")
          if [ "$CARGO_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Cargo version ($CARGO_VERSION) != npm version ($NPM_VERSION)."
            exit 1
          fi
          REF="${GITHUB_REF_NAME:-}"
          if [ -n "$REF" ]; then
            case "$REF" in
              plugin-v*)
                TAG_VERSION="${REF#plugin-v}"
                ;;
              *)
                echo "::error::Unexpected tag '$REF' — expected the 'plugin-v*' prefix."
                exit 1
                ;;
            esac
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) != Cargo/npm version ($CARGO_VERSION)."
              exit 1
            fi
            echo "Versions agree: tag=$TAG_VERSION cargo=$CARGO_VERSION npm=$NPM_VERSION"
          else
            echo "workflow_dispatch (no tag): Cargo=$CARGO_VERSION npm=$NPM_VERSION (tag check skipped)"
          fi

      - name: cargo package
        run: cargo package
        working-directory: tauri-plugin-background-service

      - name: cargo build --release --all-targets
        run: cargo build --release --all-targets --features desktop-service
        working-directory: tauri-plugin-background-service

      - name: cargo test --all-targets
        run: cargo test --all-targets --features desktop-service
        working-directory: tauri-plugin-background-service

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tauri-plugin-background-service/guest-js/package-lock.json

      - name: guest-js build + test
        run: |
          npm ci
          npm run build
          npm test
        working-directory: tauri-plugin-background-service/guest-js

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service

      - name: Publish crate
        working-directory: tauri-plugin-background-service
        # REL-01: removed --no-verify. cargo publish now compiles the crate
        # from the published tarball before uploading, catching manifest drift
        # (missing files, bad include/exclude) that --no-verify hid.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: publish-crate
    # CI-03 / REL-01: OIDC provenance scope lives ONLY on this job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: tauri-plugin-background-service/guest-js
        run: npm ci

      - name: Build
        working-directory: tauri-plugin-background-service/guest-js
        run: npm run build

      - name: Publish
        working-directory: tauri-plugin-background-service/guest-js
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
