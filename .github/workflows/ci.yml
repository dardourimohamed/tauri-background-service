name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-03: least-privilege default. The publish workflow keeps its scoped OIDC
# grant on the npm job; CI itself only needs to read repo contents.
permissions:
  contents: read

# CI-03: cancel superseded in-progress runs on the same branch/PR so the latest
# push is what gates merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - run: cargo fmt --check
        working-directory: tauri-plugin-background-service

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # CI-02: --all-targets so examples/tests/benches are type-checked too.
      - run: cargo check --all-targets
        working-directory: tauri-plugin-background-service

  # CI-02: MSRV gate. Bumped to 1.88.0 to track the dependency floor: the
  # v1.0.1 lock resolves transitive deps (time/serde_with/zvariant/zbus etc.)
  # whose declared rust-version reaches 1.88, and several edition2024 deps
  # need cargo >= 1.85. Pinning them back to 1.77.2 is an unmaintainable
  # treadmill, so the gate now reflects the effective dependency MSRV.
  msrv:
    name: cargo check (MSRV 1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo check --features desktop-service
        working-directory: tauri-plugin-background-service

  check-android:
    name: cargo check (Android aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - run: cargo check --target aarch64-linux-android
        working-directory: tauri-plugin-background-service

  # CI-02: second Android ABI. The plugin must build for x86_64 emulators too,
  # not just aarch64 devices.
  check-android-x86_64:
    name: cargo check (Android x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - run: cargo check --target x86_64-linux-android
        working-directory: tauri-plugin-background-service

  check-ios:
    name: cargo check (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - run: cargo check --target aarch64-apple-ios
        working-directory: tauri-plugin-background-service

  check-desktop-service:
    name: cargo check (desktop-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo check --features desktop-service
        working-directory: tauri-plugin-background-service

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # CI-02: --all-targets so integration tests / examples / benches run.
      - run: cargo test --all-targets --features desktop-service
        working-directory: tauri-plugin-background-service

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # CI-02: --all-targets --all-features so every cfg combination is linted.
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: tauri-plugin-background-service

  ts:
    name: TypeScript build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-plugin-background-service/guest-js/package-lock.json
      # CI-01: reproducible install (no lock drift) and Vitest actually runs.
      - run: npm ci
        working-directory: tauri-plugin-background-service/guest-js
      - run: npm run build
        working-directory: tauri-plugin-background-service/guest-js
      - run: npm test
        working-directory: tauri-plugin-background-service/guest-js

  # CI-02: the test-app frontend must build too — its index.html imports the
  # plugin via a file: dep and a Vite break would ship silently otherwise.
  test-app-frontend:
    name: test-app frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-app/package-lock.json
      # The test-app imports the plugin through a `file:` dep whose package.json
      # `exports` resolve to dist-js/ — a gitignored build artifact absent from a
      # fresh checkout. Build the plugin first so Vite can resolve its entry.
      - run: npm ci
        working-directory: tauri-plugin-background-service/guest-js
      - run: npm run build
        working-directory: tauri-plugin-background-service/guest-js
      - run: npm ci
        working-directory: test-app
      - run: npm run build
        working-directory: test-app

  android-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      # CI-03: cargo metadata package path lookup replaces the fragile
      # filesystem `find` against ~/.cargo/registry/src. Empty/missing path
      # fails the step loudly instead of substituting an empty env var.
      - name: Resolve Tauri Android SDK path
        run: |
          cd tauri-plugin-background-service
          cargo fetch
          TAURI_MANIFEST=$(cargo metadata --format-version 1 \
            | python3 -c "import sys,json; m=json.load(sys.stdin); print(next((p['manifest_path'] for p in m['packages'] if p['name']=='tauri'), ''))")
          if [ -z "$TAURI_MANIFEST" ]; then
            echo "::error::cargo metadata did not resolve the 'tauri' package. Did 'cargo fetch' run?"
            exit 1
          fi
          TAURI_ANDROID_PATH="$(dirname "$TAURI_MANIFEST")/mobile/android"
          if [ ! -d "$TAURI_ANDROID_PATH" ]; then
            echo "::error::Tauri Android SDK directory not found at '$TAURI_ANDROID_PATH'."
            exit 1
          fi
          echo "Resolved TAURI_ANDROID_PATH=$TAURI_ANDROID_PATH"
          echo "TAURI_ANDROID_PATH=${TAURI_ANDROID_PATH}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Setup Gradle project
        run: |
          cd tauri-plugin-background-service/android
          mkdir -p ci-build
          cat > ci-build/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id("com.android.library") version "8.11.0" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.25" apply false
              }
          }
          rootProject.name = "bg-service-ci"
          include ":tauri-android"
          project(":tauri-android").projectDir = new File("${TAURI_ANDROID_PATH}")
          include ":plugin"
          project(":plugin").projectDir = new File(settingsDir, "..")
          EOF
          cat > ci-build/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "android.useAndroidX=true" > ci-build/gradle.properties
      - name: Run unit tests
        working-directory: tauri-plugin-background-service/android/ci-build
        run: gradle :plugin:testDebugUnitTest

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      # CI-03: cargo metadata package path lookup; fails loudly on missing path.
      - name: Resolve Tauri Android SDK path
        run: |
          cd tauri-plugin-background-service
          cargo fetch
          TAURI_MANIFEST=$(cargo metadata --format-version 1 \
            | python3 -c "import sys,json; m=json.load(sys.stdin); print(next((p['manifest_path'] for p in m['packages'] if p['name']=='tauri'), ''))")
          if [ -z "$TAURI_MANIFEST" ]; then
            echo "::error::cargo metadata did not resolve the 'tauri' package. Did 'cargo fetch' run?"
            exit 1
          fi
          TAURI_ANDROID_PATH="$(dirname "$TAURI_MANIFEST")/mobile/android"
          if [ ! -d "$TAURI_ANDROID_PATH" ]; then
            echo "::error::Tauri Android SDK directory not found at '$TAURI_ANDROID_PATH'."
            exit 1
          fi
          echo "Resolved TAURI_ANDROID_PATH=$TAURI_ANDROID_PATH"
          echo "TAURI_ANDROID_PATH=${TAURI_ANDROID_PATH}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Setup Gradle project
        run: |
          cd tauri-plugin-background-service/android
          mkdir -p ci-build
          cat > ci-build/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id("com.android.library") version "8.11.0" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.25" apply false
              }
          }
          rootProject.name = "bg-service-ci"
          include ":tauri-android"
          project(":tauri-android").projectDir = new File("${TAURI_ANDROID_PATH}")
          include ":plugin"
          project(":plugin").projectDir = new File(settingsDir, "..")
          EOF
          cat > ci-build/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "android.useAndroidX=true" > ci-build/gradle.properties
      - name: Run lint
        working-directory: tauri-plugin-background-service/android/ci-build
        # CI-01: lint is fatal. Removed `continue-on-error: true` so a real
        # lint regression fails the build instead of being silently swallowed.
        run: gradle :plugin:lintDebug

  ios-build:
    name: iOS Swift compile + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      # CI-03: cargo metadata package path lookup; fails loudly on missing path.
      - name: Resolve Tauri iOS SDK path
        run: |
          cd tauri-plugin-background-service
          cargo fetch
          TAURI_MANIFEST=$(cargo metadata --format-version 1 \
            | python3 -c "import sys,json; m=json.load(sys.stdin); print(next((p['manifest_path'] for p in m['packages'] if p['name']=='tauri'), ''))")
          if [ -z "$TAURI_MANIFEST" ]; then
            echo "::error::cargo metadata did not resolve the 'tauri' package. Did 'cargo fetch' run?"
            exit 1
          fi
          TAURI_IOS_PATH="$(dirname "$TAURI_MANIFEST")/mobile/ios-api"
          if [ ! -d "$TAURI_IOS_PATH" ]; then
            echo "::error::Tauri iOS SDK directory not found at '$TAURI_IOS_PATH'."
            exit 1
          fi
          echo "Resolved TAURI_IOS_PATH=$TAURI_IOS_PATH"
          echo "TAURI_IOS_PATH=${TAURI_IOS_PATH}" >> "$GITHUB_ENV"
      - name: Generate Package.swift
        run: |
          cd tauri-plugin-background-service/ios
          cat > Package.swift <<EOF
          // swift-tools-version:5.5
          import PackageDescription

          // CI: this manifest mirrors the committed ios/Package.swift (proven to
          // resolve by the `cargo check (iOS)` job) exactly, swapping only the
          // Tauri dependency path for the cargo-registry checkout. Crucially it
          // declares an explicit `products:` entry — without it xcodebuild derives
          // no scheme from a SwiftPM package and fails with "does not contain a
          // scheme named ...". Names match the crate (swift-rs CARGO_PKG_NAME).
          let package = Package(
            name: "tauri-plugin-background-service",
            platforms: [
              .iOS(.v14),
            ],
            products: [
              .library(
                name: "tauri-plugin-background-service",
                type: .static,
                targets: ["tauri-plugin-background-service"])
            ],
            dependencies: [
              .package(name: "Tauri", path: "${TAURI_IOS_PATH}")
            ],
            targets: [
              .target(
                name: "tauri-plugin-background-service",
                dependencies: [
                  .byName(name: "Tauri")
                ],
                path: "Sources/TauriPluginBackgroundService"),
              .testTarget(
                name: "tauri-plugin-background-serviceTests",
                dependencies: [
                  .byName(name: "tauri-plugin-background-service")
                ],
                path: "Tests/TauriPluginBackgroundServiceTests")
            ]
          )
          EOF
      # CI-01: actually run the XCTest target, not just `xcodebuild build`.
      - name: Test
        working-directory: tauri-plugin-background-service/ios
        run: |
          xcodebuild test \
            -scheme tauri-plugin-background-service \
            -destination 'platform=iOS Simulator,name=iPhone 17'

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-background-service
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # CI-02: deny rustdoc warnings (broken intra-doc links etc.).
      - run: cargo doc --no-deps --features desktop-service
        working-directory: tauri-plugin-background-service
        env:
          RUSTDOCFLAGS: "-D warnings"
