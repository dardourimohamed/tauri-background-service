<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Service Test App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #333333;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .status-line {
            display: flex;
            align-items: center;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #F44336;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .status-dot.running {
            background: #4CAF50;
        }

        .tick-count {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .tick-count span {
            font-variant-numeric: tabular-nums;
        }

        button {
            display: block;
            width: 100%;
            height: 44px;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .btn-green { background: #4CAF50; }
        .btn-red { background: #F44336; }
        .btn-blue { background: #2196F3; }
        .btn-orange { background: #FF9800; }
        .btn-purple { background: #9C27B0; }
        .btn-teal { background: #009688; }
        .btn-grey { background: #607D8B; }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .btn-row button {
            flex: 1;
            margin-bottom: 0;
        }

        h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 14px;
            border-top: 1px solid #e0e0e0;
            padding-top: 10px;
            color: #555;
        }

        .info-card {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .info-card .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-card .value {
            font-weight: 500;
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }

        .guarantee-good { color: #4CAF50; font-weight: 600; }
        .guarantee-ok { color: #FF9800; font-weight: 600; }
        .guarantee-bad { color: #F44336; font-weight: 600; }

        .issue-item {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }

        .issue-item:last-child {
            border-bottom: none;
        }

        .issue-code {
            font-weight: 600;
            font-size: 12px;
        }

        .issue-error .issue-code { color: #F44336; }
        .issue-warning .issue-code { color: #FF9800; }
        .issue-info .issue-code { color: #2196F3; }

        .severity-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        .severity-badge.error { background: #FFEBEE; color: #C62828; }
        .severity-badge.warning { background: #FFF3E0; color: #E65100; }
        .severity-badge.info { background: #E3F2FD; color: #1565C0; }

        .issue-msg {
            font-size: 12px;
            color: #555;
        }

        .issue-fix {
            font-size: 11px;
            color: #2196F3;
            font-style: italic;
        }

        #event-log {
            max-height: 250px;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
        }

        .log-entry {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-entry.info { color: #2196F3; }
        .log-entry.tick { color: #4CAF50; }
        .log-entry.error { color: #F44336; }
        .log-entry.stopped { color: #F44336; }

        .lifecycle-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lifecycle-badge.idle { background: #E0E0E0; color: #757575; }
        .lifecycle-badge.starting { background: #E3F2FD; color: #1565C0; }
        .lifecycle-badge.running { background: #E8F5E9; color: #2E7D32; }
        .lifecycle-badge.stopping { background: #FFF3E0; color: #E65100; }
        .lifecycle-badge.stopped { background: #FFEBEE; color: #C62828; }
        .lifecycle-badge.recovering { background: #F3E5F5; color: #6A1B9A; }
        .lifecycle-badge.recoveryPending { background: #E0F2F1; color: #00695C; }
        .lifecycle-badge.expired { background: #FFF3E0; color: #E65100; }
        .lifecycle-badge.blocked { background: #FFEBEE; color: #C62828; }
        .lifecycle-badge.error { background: #FFEBEE; color: #C62828; }

        .kv-row { padding: 2px 0; }
        .kv-row .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .kv-row .value { font-weight: 500; color: #333; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Background Service Test App</h1>

    <!-- Status -->
    <div class="status-line">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">idle</span>
    </div>

    <div class="tick-count">
        Tick Count: <span id="tick-count">0</span>
    </div>

    <!-- Core controls -->
    <button id="start-btn" class="btn-green">Start Service</button>
    <button id="stop-btn" class="btn-red">Stop Service</button>
    <button id="check-btn" class="btn-blue">Check Status</button>

    <!-- Validation Issues -->
    <h2>Validation Issues</h2>
    <div id="validation-issues-card" class="info-card" style="display:none;"></div>
    <button id="validation-issues-btn" class="btn-teal">Refresh Issues</button>

    <!-- Platform Capabilities -->
    <h2>Platform Capabilities</h2>
    <div id="capabilities-card" class="info-card" style="display:none;"></div>
    <button id="capabilities-btn" class="btn-blue">Get Capabilities</button>

    <!-- Lifecycle Status -->
    <h2>Lifecycle Status</h2>
    <div id="lifecycle-card" class="info-card" style="display:none;"></div>
    <button id="lifecycle-btn" class="btn-blue">Get Lifecycle Status</button>

    <!-- Recovery -->
    <h2>Recovery</h2>
    <div class="btn-row">
        <button id="enable-recovery-btn" class="btn-green">Enable</button>
        <button id="disable-recovery-btn" class="btn-red">Disable</button>
    </div>

    <!-- Validate Setup -->
    <h2>Validate Setup</h2>
    <button id="validate-btn" class="btn-purple">Validate Setup</button>
    <div id="validate-card" class="info-card" style="display:none;"></div>

    <!-- Desktop OS Service -->
    <h2 id="desktop-heading" class="hidden">Desktop OS Service</h2>
    <div id="desktop-section" class="hidden">
        <div class="btn-row">
            <button id="install-btn" class="btn-green">Install</button>
            <button id="uninstall-btn" class="btn-red">Uninstall</button>
        </div>
        <div class="btn-row">
            <button id="os-start-btn" class="btn-teal">Start OS</button>
            <button id="os-stop-btn" class="btn-orange">Stop OS</button>
        </div>
        <button id="os-restart-btn" class="btn-orange">Restart OS Service</button>
        <button id="os-status-btn" class="btn-blue">Get OS Status</button>
        <div id="os-status-card" class="info-card" style="display:none;"></div>
    </div>

    <!-- Event Log -->
    <h2>Event Log</h2>
    <div id="event-log"></div>

    <script type="module">
        import {
            startService,
            stopService,
            isServiceRunning,
            getLifecycleStatus,
            getPlatformCapabilities,
            configureRecovery,
            validateBackgroundServiceSetup,
            normalizeBackgroundServiceError,
            onPluginEvent,
            installService,
            uninstallService,
            startOsService,
            stopOsService,
            restartOsService,
            getOsServiceStatus,
        } from '@tauri-apps/plugin-background-service';
        import { listen } from '@tauri-apps/api/event';

        function updateStatus(state) {
            var statusText = document.getElementById('status-text');
            var statusDot = document.getElementById('status-dot');
            statusText.textContent = state;
            var activeStates = ['running', 'starting', 'recovering', 'recoveryPending'];
            if (activeStates.indexOf(state) >= 0) {
                statusDot.classList.add('running');
            } else {
                statusDot.classList.remove('running');
            }
        }

        function updateTickCount(count) {
            document.getElementById('tick-count').textContent = count;
        }

        function addLogEntry(type, detail) {
            var log = document.getElementById('event-log');
            var entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            var now = new Date();
            var time = now.toTimeString().split(' ')[0];
            entry.textContent = time + ' ' + type + ': ' + detail;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function handleError(e) {
            var err = normalizeBackgroundServiceError(e);
            addLogEntry('error', '[' + err.code + '] ' + err.message);
        }

        function guaranteeClass(g) {
            if (g === 'guaranteed') return 'guarantee-good';
            if (g === 'bestEffort') return 'guarantee-ok';
            return 'guarantee-bad';
        }

        function esc(s) {
            var d = document.createElement('div');
            d.textContent = String(s ?? '—');
            return d.innerHTML;
        }

        // ── Event listeners ───────────────────────────────────────────

        async function initListeners() {
            await onPluginEvent(function(payload) {
                if (payload.type === 'started') {
                    updateStatus('running');
                    addLogEntry('info', 'Service started');
                } else if (payload.type === 'stopped') {
                    updateStatus('stopped');
                    var reason = payload.reason || 'unknown';
                    addLogEntry('stopped', 'Service stopped [stopReason: ' + reason + ']');
                } else if (payload.type === 'error') {
                    addLogEntry('error', 'Service error: ' + (payload.message || 'unknown'));
                }
            });

            await listen('service-tick', function(event) {
                var count = event.payload;
                updateTickCount(count);
                addLogEntry('tick', 'Tick #' + count);
            });

            await listen('service-stopped', function(event) {
                updateStatus('stopped');
                updateTickCount(event.payload);
                addLogEntry('stopped', 'Service stopped at tick #' + event.payload);
            });

            addLogEntry('info', 'App initialized');
        }

        initListeners();

        // ── Core controls ─────────────────────────────────────────────

        document.getElementById('start-btn').addEventListener('click', async function() {
            try {
                await startService({ serviceLabel: 'Test Service' });
            } catch (e) {
                handleError(e);
            }
        });

        document.getElementById('stop-btn').addEventListener('click', async function() {
            try {
                await stopService();
            } catch (e) {
                handleError(e);
            }
        });

        document.getElementById('check-btn').addEventListener('click', async function() {
            try {
                var status = await getLifecycleStatus();
                updateStatus(status.state);
                addLogEntry('info', 'Status: ' + status.state);
            } catch (e) {
                handleError(e);
            }
        });

        // ── Platform Capabilities ─────────────────────────────────────

        document.getElementById('capabilities-btn').addEventListener('click', async function() {
            try {
                var caps = await getPlatformCapabilities();
                var card = document.getElementById('capabilities-card');
                card.style.display = 'block';
                card.innerHTML =
                    '<div class="info-grid">' +
                        '<div><span class="label">Platform</span><br><span class="value">' + esc(caps.platform) + '</span></div>' +
                        '<div><span class="label">Mode</span><br><span class="value">' + esc(caps.lifecycleMode) + '</span></div>' +
                        '<div><span class="label">App Close</span><br><span class="' + guaranteeClass(caps.survivesAppClose) + '">' + esc(caps.survivesAppClose) + '</span></div>' +
                        '<div><span class="label">Reboot</span><br><span class="' + guaranteeClass(caps.survivesReboot) + '">' + esc(caps.survivesReboot) + '</span></div>' +
                        '<div><span class="label">Force Quit</span><br><span class="' + guaranteeClass(caps.survivesForceQuit) + '">' + esc(caps.survivesForceQuit) + '</span></div>' +
                        '<div><span class="label">BG Exec</span><br><span class="' + guaranteeClass(caps.backgroundExecution) + '">' + esc(caps.backgroundExecution) + '</span></div>' +
                    '</div>' +
                    (caps.limitations.length > 0 ? '<div style="margin-top:6px;"><span class="label">Limitations</span><br>' + caps.limitations.map(function(l) { return '&bull; ' + esc(l); }).join('<br>') + '</div>' : '');
                addLogEntry('info', 'Capabilities: ' + caps.platform + ' / ' + caps.lifecycleMode);
            } catch (e) {
                handleError(e);
            }
        });

        // ── Lifecycle Status ─────────────────────────────────────────────

        function lifecycleBadge(state) {
            return '<span class="lifecycle-badge ' + state + '">' + esc(state) + '</span>';
        }

        document.getElementById('lifecycle-btn').addEventListener('click', async function() {
            try {
                var ls = await getLifecycleStatus();
                var card = document.getElementById('lifecycle-card');
                card.style.display = 'block';

                var html = '<div style="margin-bottom:6px;">' + lifecycleBadge(ls.state) + '</div>';
                html += '<div class="info-grid">';

                html += '<div class="kv-row"><span class="label">State</span><br><span class="value">' + lifecycleBadge(ls.state) + '</span></div>';
                html += '<div class="kv-row"><span class="label">Platform</span><br><span class="value">' + esc(ls.platform) + '</span></div>';
                html += '<div class="kv-row"><span class="label">DesiredRunning</span><br><span class="value">' + esc(ls.desiredRunning) + '</span></div>';
                html += '<div class="kv-row"><span class="label">RecoveryEnabled</span><br><span class="value">' + esc(ls.recoveryEnabled) + '</span></div>';
                html += '<div class="kv-row"><span class="label">RecoveryPending</span><br><span class="value">' + esc(ls.recoveryPending) + '</span></div>';

                if (ls.lastError) {
                    html += '<div class="kv-row"><span class="label">LastError</span><br><span class="value" style="color:#F44336;">' + esc(ls.lastError) + '</span></div>';
                }
                if (ls.recoveryReason) {
                    html += '<div class="kv-row"><span class="label">RecoveryReason</span><br><span class="value">' + esc(ls.recoveryReason) + '</span></div>';
                }
                if (ls.lastPlatformState) {
                    html += '<div class="kv-row"><span class="label">NativeState</span><br><span class="value">' + esc(ls.lastPlatformState) + '</span></div>';
                }
                if (ls.lastPlatformError) {
                    html += '<div class="kv-row"><span class="label">PlatformError</span><br><span class="value" style="color:#F44336;">' + esc(ls.lastPlatformError) + '</span></div>';
                }
                if (ls.lastStartConfig) {
                    html += '<div class="kv-row"><span class="label">StartConfig</span><br><span class="value">' + esc(JSON.stringify(ls.lastStartConfig)) + '</span></div>';
                }

                html += '</div>';
                card.innerHTML = html;
                updateStatus(ls.state);
                addLogEntry('info', 'Lifecycle: ' + ls.state + ' / desired=' + ls.desiredRunning + ' / recovery=' + ls.recoveryEnabled);
            } catch (e) {
                handleError(e);
            }
        });

        // ── Recovery ────────────────────────────────────────────────────

        document.getElementById('enable-recovery-btn').addEventListener('click', async function() {
            try {
                await configureRecovery({ enabled: true, config: { serviceLabel: 'Test Service' } });
                addLogEntry('info', 'Recovery enabled');
            } catch (e) {
                handleError(e);
            }
        });

        document.getElementById('disable-recovery-btn').addEventListener('click', async function() {
            try {
                await configureRecovery({ enabled: false });
                addLogEntry('info', 'Recovery disabled');
            } catch (e) {
                handleError(e);
            }
        });

        // ── Validate Setup ─────────────────────────────────────────────

        document.getElementById('validate-btn').addEventListener('click', async function() {
            try {
                var report = await validateBackgroundServiceSetup();
                var card = document.getElementById('validate-card');
                card.style.display = 'block';
                var html = '<div><strong>' + (report.ok ? '&#10003; OK' : '&#10007; Issues found') + '</strong></div>';

                if (report.errors.length > 0) {
                    html += '<div style="margin-top:4px;"><span class="label">Errors</span></div>';
                    report.errors.forEach(function(issue) {
                        html += '<div class="issue-item issue-error"><span class="issue-code">[' + esc(issue.code) + ']</span> <span class="issue-msg">' + esc(issue.message) + '</span>' +
                            (issue.fix ? '<br><span class="issue-fix">Fix: ' + esc(issue.fix) + '</span>' : '') + '</div>';
                    });
                }

                if (report.warnings.length > 0) {
                    html += '<div style="margin-top:4px;"><span class="label">Warnings</span></div>';
                    report.warnings.forEach(function(issue) {
                        html += '<div class="issue-item issue-warning"><span class="issue-code">[' + esc(issue.code) + ']</span> <span class="issue-msg">' + esc(issue.message) + '</span>' +
                            (issue.fix ? '<br><span class="issue-fix">Fix: ' + esc(issue.fix) + '</span>' : '') + '</div>';
                    });
                }

                card.innerHTML = html;
                addLogEntry('info', 'Validation: ' + (report.ok ? 'OK' : report.errors.length + ' errors, ' + report.warnings.length + ' warnings'));
            } catch (e) {
                handleError(e);
            }
        });

        // ── Validation Issues ─────────────────────────────────────────

        async function renderValidationIssues() {
            try {
                var report = await validateBackgroundServiceSetup();
                var card = document.getElementById('validation-issues-card');
                card.style.display = 'block';
                var issues = report.issues || [];
                var html = '<div style="margin-bottom:6px;font-weight:600;">' +
                    (issues.length === 0
                        ? '<span style="color:#4CAF50;">&#10003; All Clear</span>'
                        : '<span style="color:#F44336;">&#10007; Issues Found (' + issues.length + ')</span>') +
                    '</div>';

                if (issues.length > 0) {
                    issues.forEach(function(issue) {
                        html += '<div class="issue-item issue-' + esc(issue.severity) + '">' +
                            '<span class="severity-badge ' + esc(issue.severity) + '">' + esc(issue.severity) + '</span>' +
                            '<span class="issue-code">[' + esc(issue.code) + ']</span> ' +
                            '<span class="issue-msg">' + esc(issue.message) + '</span>' +
                            (issue.fix ? '<br><span class="issue-fix">Fix: ' + esc(issue.fix) + '</span>' : '') +
                            '<br><span style="font-size:10px;color:#999;">' + esc(issue.platform) + '</span>' +
                            '</div>';
                    });
                }

                card.innerHTML = html;
                addLogEntry('info', 'Validation issues: ' + issues.length + ' issue(s)');
            } catch (e) {
                handleError(e);
            }
        }

        document.getElementById('validation-issues-btn').addEventListener('click', renderValidationIssues);

        // ── Desktop OS Service (gated) ────────────────────────────────

        function setupDesktopSection() {
            getPlatformCapabilities().then(function(caps) {
                if (caps.platform === 'linux' || caps.platform === 'macos') {
                    document.getElementById('desktop-heading').classList.remove('hidden');
                    document.getElementById('desktop-section').classList.remove('hidden');
                }
            }).catch(function() {});
        }

        setupDesktopSection();

        document.getElementById('install-btn').addEventListener('click', async function() {
            try { await installService(); addLogEntry('info', 'OS service installed'); } catch (e) { handleError(e); }
        });

        document.getElementById('uninstall-btn').addEventListener('click', async function() {
            try { await uninstallService(); addLogEntry('info', 'OS service uninstalled'); } catch (e) { handleError(e); }
        });

        document.getElementById('os-start-btn').addEventListener('click', async function() {
            try { await startOsService(); addLogEntry('info', 'OS service started'); } catch (e) { handleError(e); }
        });

        document.getElementById('os-stop-btn').addEventListener('click', async function() {
            try { await stopOsService(); addLogEntry('info', 'OS service stopped'); } catch (e) { handleError(e); }
        });

        document.getElementById('os-restart-btn').addEventListener('click', async function() {
            try { await restartOsService(); addLogEntry('info', 'OS service restarted'); } catch (e) { handleError(e); }
        });

        document.getElementById('os-status-btn').addEventListener('click', async function() {
            try {
                var s = await getOsServiceStatus();
                var card = document.getElementById('os-status-card');
                card.style.display = 'block';
                card.innerHTML =
                    '<div class="info-grid">' +
                        '<div><span class="label">Label</span><br><span class="value">' + esc(s.label) + '</span></div>' +
                        '<div><span class="label">Mode</span><br><span class="value">' + esc(s.mode) + '</span></div>' +
                        '<div><span class="label">Installed</span><br><span class="value">' + esc(s.installed) + '</span></div>' +
                        '<div><span class="label">IPC</span><br><span class="value">' + esc(s.ipcConnected) + '</span></div>' +
                        (s.socketPath ? '<div><span class="label">Socket</span><br><span class="value" style="font-size:11px;">' + esc(s.socketPath) + '</span></div>' : '') +
                        (s.lastError ? '<div><span class="label">Error</span><br><span class="value" style="color:#F44336;">' + esc(s.lastError) + '</span></div>' : '') +
                    '</div>';
                addLogEntry('info', 'OS status: ' + s.installed + ' / ipc=' + s.ipcConnected);
            } catch (e) {
                handleError(e);
            }
        });
    </script>
</body>
</html>
